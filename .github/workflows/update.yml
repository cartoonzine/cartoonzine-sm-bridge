name: Gerador de BD Cartoonzine

on:
  schedule:
    # Roda todo dia às 09:00 UTC (06:00 da manhã no horário de Brasília), 
    # garantindo que o Saimo já atualizou o catálogo dele.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Atualizado para 22 para remover o aviso

      - name: Executar Scraper Ponte
        run: npm start
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Comitar novos arquivos de BD
        run: |
          git config --global user.name "Cartoonzine Bot"
          git config --global user.email "bot@cartoonzine.com"
          
          # Salva todos os arquivos gerados hoje (Canais, Adultos, Rádios, Filmes, Séries)
          git add *_saimo.json *_saimo.m3u *_saimo.js
          
          git commit -m "☁️ Atualização diária dos BDs Saimo separados" || echo "Sem mudanças para comitar"
          git push
