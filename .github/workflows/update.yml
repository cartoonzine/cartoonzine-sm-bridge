name: Gerador de BD Cartoonzine

on:
  schedule:
    # 09:00 UTC = 06:00 da manhã no horário de Brasília (logo após a atualização da fonte)
    - cron: '0 9 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Executar Scraper Ponte
        run: npm start
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}

      - name: Validar arquivos gerados
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VALIDAÇÃO DO CARTOONZINE-SM-BRIDGE"
          echo "========================================"

          test -s filmes_saimo.json
          test -s series_saimo_pt1.json
          test -s series_saimo_pt2.json
          test -s series_saimo_pt3.json
          test -s adultos_vod_saimo.json

          CANAIS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('canais_saimo.json', 'utf8')).length)")
          FILMES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('filmes_saimo.json', 'utf8')).length)")
          
          SERIES1=$(node -e "console.log(JSON.parse(require('fs').readFileSync('series_saimo_pt1.json', 'utf8')).length)")
          SERIES2=$(node -e "console.log(JSON.parse(require('fs').readFileSync('series_saimo_pt2.json', 'utf8')).length)")
          SERIES3=$(node -e "console.log(JSON.parse(require('fs').readFileSync('series_saimo_pt3.json', 'utf8')).length)")
          TOTAL_SERIES=$((SERIES1 + SERIES2 + SERIES3))

          echo "Canais: $CANAIS"
          echo "Filmes: $FILMES"
          echo "Séries (Total): $TOTAL_SERIES"

          if [ "$CANAIS" -lt 100 ]; then
            echo "ERRO: menos de 100 entradas de canais/fontes."
            exit 1
          fi

          if [ "$FILMES" -eq 0 ]; then
            echo "ERRO: nenhum filme foi gerado."
            exit 1
          fi

          if [ "$TOTAL_SERIES" -eq 0 ]; then
            echo "ERRO: nenhuma série foi gerada."
            exit 1
          fi

          echo "========================================"
          echo "VALIDAÇÃO OK"
          echo "========================================"

      - name: Comitar novos arquivos de BD
        shell: bash
        run: |
          git config --global user.name "Cartoonzine Bot"
          git config --global user.email "bot@cartoonzine.com"

          # Remove do repositório o arquivo antigo pesado, se ele existir lá
          git rm -f series_saimo.json || true

          # Adiciona todos os arquivos (incluí o destaques que estava faltando)
          git add canais_saimo.json filmes_saimo.json series_saimo_pt1.json series_saimo_pt2.json series_saimo_pt3.json adultos_vod_saimo.json destaques_saimo.json

          if git diff --cached --quiet; then
            echo "Sem mudanças para comitar."
          else
            git commit -m "☁️ Atualização diária dos BDs Saimo em partes para evitar limite de 100MB"
            git pull --rebase origin main
            git push
          fi
